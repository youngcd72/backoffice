# -------------------------------------------------------------------
# 통합 테스트 프로파일 (BatchFlowIntegrationTest)
# PostgreSQL 임시 스키마(TestSchemaInitializer)에 업무 테이블·BATCH_*·QRTZ_* 를 새로 만들어
# 개발 DB를 건드리지 않고 Spring Batch + Quartz + MyBatis 전체 흐름을 검증한다.
# 데이터소스 URL·계정은 TestSchemaInitializer 가 컨텍스트마다 만든 임시 스키마로 덮어쓴다.
# 테스트 DB 접속 정보: coder.test.db.url / username / password (아래 기본값: 로컬 도커 PostgreSQL)
# -------------------------------------------------------------------
spring:
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1

  sql:
    init:
      mode: always
      schema-locations:
        - file:../../schema/table/TB_USR_M.sql
        - file:../../schema/table/TB_DSPT_JOB_M.sql
        - file:../../schema/table/TB_DSPT_EXEC_L.sql
      data-locations:
        - classpath:sql/batch-flow-data.sql

  batch:
    jdbc:
      initialize-schema: always

  quartz:
    jdbc:
      initialize-schema: always
    wait-for-jobs-to-complete-on-shutdown: false
    properties:
      org.quartz.jobStore.isClustered: false
      org.quartz.threadPool.threadCount: 3

coder:
  test:
    db:
      url: ${CODER_TEST_DB_URL:jdbc:postgresql://localhost:5432/coder}
      username: ${CODER_TEST_DB_USERNAME:coder}
      password: ${CODER_TEST_DB_PASSWORD:coder1234!}
